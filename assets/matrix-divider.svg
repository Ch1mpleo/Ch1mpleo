        from { transform: translateY(-92px); }
        to { transform: translateY(112px); }
      }
      .d1 { animation: fall 3.8s linear infinite -1.2s; }
      .d2 { animation: fall 4.9s linear infinite -3.7s; }
      .d3 { animation: fall 5.8s linear infinite -2.4s; }
      .d4 { animation: fall 4.3s linear infinite -4.1s; }
      .d5 { animation: fall 6.4s linear infinite -5.6s; }
      @media (prefers-reduced-motion: reduce) {
        .d1, .d2, .d3, .d4, .d5 { animation: none; }
      }
    </style>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
