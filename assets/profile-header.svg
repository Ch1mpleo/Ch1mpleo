    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes rain {
        from { transform: translateY(-390px); }
        to { transform: translateY(390px); }
      }
      .r1 { animation: rain 5.2s linear infinite -1.1s; }
      .r2 { animation: rain 6.8s linear infinite -4.7s; }
      .r3 { animation: rain 4.6s linear infinite -2.3s; }
      .r4 { animation: rain 7.4s linear infinite -5.9s; }
      .r5 { animation: rain 5.9s linear infinite -3.4s; }
      .r6 { animation: rain 8.1s linear infinite -7.2s; }
      @media (prefers-reduced-motion: reduce) {
        .r1, .r2, .r3, .r4, .r5, .r6 { animation: none; }
      }
    </style>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
